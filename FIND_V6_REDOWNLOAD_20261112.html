function storyPage(c){const r=c.story[st.scene];return heading(c,'대면 기록','문장 속 색상은 단서의 종류만 표시합니다. 정답이나 위반 여부를 알려주지 않습니다.')+`<div class="grid-story"><section class="character"><div class="dept">CASE FILE / NEW ARRIVAL</div><h2>${esc(c.overview)}</h2><p>신고가 접수되었습니다. 조사 대상자는 자신의 입장을 이야기하려 합니다.</p><div class="figure">${portrait()}</div><div class="identity">${esc(c.name)} · ${esc(c.job)}</div></section><section><div class="paper"><div class="paperhead"><strong>진술 기록 ${String(st.scene+1).padStart(2,'0')}</strong><small>${st.scene+1} / ${c.story.length} 장면</small></div><div class="paperbody"><div class="record"><strong>${esc(r.who)}</strong><span>조사실 A</span></div><p class="narration">접수 서류와 당사자의 발언을 함께 검토하자.</p><p class="speech">${r.text}</p><div class="actions"><button class="btn small" id="prevStory" ${st.scene===0?'disabled':''}>← 이전 대화</button><button class="btn small primary" id="nextStory">${st.scene===c.story.length-1?'자료 조사 시작 →':'다음 대화 읽기 →'}</button></div></div></div><div class="legend"><span class="word date">시간</span><span class="word money">가격·수량</span><span class="word person">기업·인물</span><span class="word rule">규정·조건</span></div><p class="notice">※ 단서의 색깔은 정보 종류를 알려줄 뿐 위반 여부를 확정하지 않습니다.</p></section></div>`}
function evidencePage(c){const facts=flatFacts();return heading(c,'조사 서류','서류에서 근거로 사용할 행을 눌러 조사 노트에 기록하세요. 업무 매뉴얼도 확인할 수 있습니다.')+`<div class="sections"><button class="seg ${st.sub==='docs'?'on':''}" id="docsTab">계약·증빙 서류</button><button class="seg ${st.sub==='manual'?'on':''}" id="manualTab">업무 매뉴얼</button></div><div class="research"><div>${st.sub==='docs'?`<div class="docs">${c.docs.map(d=>`<section class="paper"><div class="paperhead"><strong>▤ ${esc(d.title)}</strong><small>${esc(d.from)}</small></div><div class="docbody"><p class="doc-desc">${esc(d.desc)}</p>${d.facts.map(([id,html])=>`<button data-fact="${id}" aria-pressed="${st.notes.has(id)}" class="fact ${st.notes.has(id)?'on':''}"><span class="check">${st.notes.has(id)?'✓':'+'}</span><span>${html}</span></button>`).join('')}</div></section>`).join('')}</div>`:`<section class="paper"><div class="paperhead"><strong>감사 매뉴얼 · 관련 규정</strong><small>교육용 규정 요약</small></div><div class="paperbody">${c.manual.map((s,i)=>`<div class="manual-rule"><b>검토 원칙 ${i+1}</b><br>${esc(s)}</div>`).join('')}<p class="notice-paper">실제 처분은 적용 법령·계약조건·사실관계 및 절차에 따라 달라집니다. 본 게임은 규정을 단순화했습니다.</p></div></section>`}</div><aside class="sidebar"><div class="note"><b>▣ 나의 조사 노트</b> <small>· ${st.notes.size}개 기록</small>${facts.filter(f=>st.notes.has(f.id)).length?facts.filter(f=>st.notes.has(f.id)).map(f=>`<div class="noteitem">${f.html}<br><small>${esc(f.from)}</small></div>`).join(''):`<p class="notice-paper">서류를 선택하면 이곳에 저장됩니다.</p>`}</div><div class="aside"><b>감사관 수첩</b><p>색깔이 있다고 모두 위반 증거는 아닙니다. 의심을 뒷받침하는 자료뿐 아니라 업체의 주장이 맞음을 보여주는 자료도 중요합니다.</p><div class="legend"><span class="word date">일자</span><span class="word money">금액</span><span class="word person">업체</span><span class="word rule">규정</span></div><button id="goReview" class="btn primary" style="margin-top:16px;width:100%">요건 검증 시작 →</button></div></aside></div>`}
function reviewPage(c){const a=audits[st.case],facts=flatFacts().filter(f=>st.notes.has(f.id));return heading(c,'요건 검증','빈칸에 단어를 넣는 대신, 감사관이 각 법적·계약상 판단 요건에 대해 근거를 갖고 결론을 내립니다.')+`<div class="review-top"><b>검증 지시서</b><br>각 질문에 <b>그렇다 / 아니다 / 추가 확인 필요</b> 중 하나를 고르고, 이를 뒷받침할 <b>근거 문서</b> 하나를 선택하세요. 질문별 결론이 나와도 <b>최종 위반 판정은 별도로 판단</b>해야 합니다.</div><div class="help-row"><span>수집된 증거: ${facts.length}건 / 총 ${flatFacts().length}건</span><button class="btn small ghost" id="backEvidence">← 증거 더 확인하기</button></div><div class="requirements">${a.questions.map((q,i)=>`<section class="requirement"><div class="reqhead"><div class="qnum">${String(i+1).padStart(2,'0')}</div><div><h3>${esc(q.q)}</h3><p>${esc(q.desc)}</p></div></div><div class="answerbox">${[['yes','그렇다'],['no','아니다'],['unknown','추가 확인 필요']].map(([v,label])=>`<button class="choicebtn ${st.answers[i].answer===v?'active':''}" data-ans="${i}" data-value="${v}" aria-pressed="${st.answers[i].answer===v}">${label}</button>`).join('')}</div><label class="prooflabel" for="proof${i}">판단을 뒷받침하는 근거</label><select class="proof" id="proof${i}" data-proof="${i}"><option value="">${facts.length?'-- 조사 노트에서 근거 선택 --':'-- 2번 화면에서 근거를 먼저 수집 --'}</option>${facts.map(f=>`<option value="${f.id}" ${st.answers[i].proof===f.id?'selected':''}>${esc(truncate(f.text,75))} [${esc(f.from)}]</option>`).join('')}</select></section>`).join('')}</div><section class="verdict"><h3>최종 감사 의견</h3><p>검증 결과를 종합해 처리를 결정하세요. 사건에 따라 위반 유형이 여러 개일 수 있습니다. <b>위반 확인 안 됨</b>은 다른 항목과 함께 선택할 수 없습니다.</p><div class="vchoices">${a.options.map(x=>`<button data-verdict="${esc(x)}" class="vbtn ${st.verdict.has(x)?'active':''}" aria-pressed="${st.verdict.has(x)}">${esc(x)}</button>`).join('')}</div><button class="btn primary" id="submit">감사 의견서 제출 · 당사자에게 근거 제시 →</button><p id="error" class="error" role="status"></p></section><div class="aside">이번 사건은 제출 이후에도 끝나지 않습니다. <b>당사자의 반응 → 후속조치 → 에필로그</b>까지 확인한 뒤 다음 사건으로 넘어갑니다.</div>`}

function submitAudit(){const err=$('error');if(st.answers.some(x=>!x.answer)){err.textContent='모든 검증 질문에 대한 판단을 선택하세요.';return}if(st.answers.some(x=>!x.proof)){err.textContent='각 검증 질문마다 조사 노트의 근거를 1건 선택하세요.';return}if(!st.verdict.size){err.textContent='최종 감사 의견을 선택하세요.';return}const a=audits[st.case];const each=60/a.questions.length;let reqScore=0;const hits=[];a.questions.forEach((q,i)=>{const answerOK=st.answers[i].answer===q.answer;const proofOK=q.proof.includes(st.answers[i].proof);reqScore+=(answerOK?each*.65:0)+(proofOK?each*.35:0);hits.push({answerOK,proofOK})});const verdictOK=st.verdict.size===a.correct.length&&a.correct.every(x=>st.verdict.has(x));const score=Math.round(reqScore+(verdictOK?40:0));st.results.push({name:cases[st.case].title,score,verdictOK,hits,chosen:Array.from(st.verdict),proofs:st.answers.map(x=>x.proof),answers:st.answers.map(x=>x.answer),demo:false});st.ending=0;showEnding()}

const finalActionLabels={keep:'기존 판정 유지',correct:'기존 판정 정정',supplement:'판정 유지 · 근거 보완'};

function selectAuditTargets(){
 const bad=st.results.map((r,i)=>({i,r})).filter(x=>!x.r.verdictOK);
 const good=st.results.map((r,i)=>({i,r})).filter(x=>x.r.verdictOK);
 bad.sort((a,b)=>a.r.score-b.r.score||a.i-b.i);
 good.sort((a,b)=>a.r.score-b.r.score||b.i-a.i);
 let chosen=[];
 if(bad.length>=2){
   chosen.push(bad[0].i);
   const firstIsFalsePositive=audits[bad[0].i].correct.includes('위반 확인 안 됨');
   const varied=bad.find(x=>x.i!==bad[0].i&&audits[x.i].correct.includes('위반 확인 안 됨')!==firstIsFalsePositive);
   chosen.push(varied?varied.i:bad[1].i);
 } else if(bad.length===1){chosen=[bad[0].i,good[0].i]}
 else{
   const preferred=[2,8,0,1].filter(i=>st.results[i].score>=80);
   chosen=(good[0].r.score<95)?good.slice(0,2).map(x=>x.i):preferred.slice(0,2);
 }
 return chosen;
}

}

 const endingName=finalEpilogueScenes()[3].head;
 $('page').innerHTML=`<div class="endpage"><div class="eyebrow">FIND!! / 10 CASES COMPLETED</div><h1>감사기록 최종 보고</h1><h2 class="ending-name">${esc(endingName)}</h2><p>첫 아홉 건의 판단과 마지막 감사관 소명까지 이어진 이야기의 결말입니다. 단순한 오답 수뿐 아니라 잘못을 설명하고 바로잡는 과정이 평가에 반영됐습니다.</p><div class="total">${total}<small> / 1000점</small></div><div class="mini-stat"><div><span>사건 정확</span><b>${9-o.wrong}/9건</b></div><div><span>오판</span><b>${o.wrong}건</b></div><div><span>최종 감사</span><b>${o.score}점</b></div></div><h3>사건별 조사 기록</h3>${st.results.map((r,i)=>`<div class="reportline"><b>${String(i+1).padStart(2,'0')}. ${esc(r.name)}</b><span class="report-grade ${r.verdictOK?'right':'wrong'}">${r.verdictOK?'판정 적합':'판정 오판'}</span><div class="report-details">${r.score}점 · 당시 판정: ${esc(r.chosen.join(' / '))}</div></div>`).join('')}<div class="reportline"><b>10. 마지막 감사 대상자</b><span class="report-grade right">최종장</span><div class="report-details">${o.score}점 · ${esc(branchNames[st.finalBranch])}</div></div><p class="notice-paper">※ 모든 사건, 인물, 처분 및 법령 요약은 게임용 가상 설정입니다.</p><div class="actions"><button class="btn primary" id="restart">처음부터 10개 사건 다시 플레이 →</button><button class="btn" id="tryRoutes">다른 결말 시험하기</button></div></div>`;
 $('viewport').scrollTop=0;
 $('restart').onclick=restartWhole;
 $('tryRoutes').onclick=()=>openDemo();
}
function restartWhole(){st.results=[];st.final=false;st.finalScenes=-1;st.demo=false;document.querySelectorAll('nav .nav').forEach((b,i)=>{b.disabled=false;b.innerHTML=`<span class="tabn">${i+1}</span>${['이야기','증거·매뉴얼','요건 검증'][i]}`});resetCase(0)}
function makeSampleResults(mode){
 const wrongSets={perfect:[],partial:[0,3,7],many:[0,1,3,6,8]};
 const indices=wrongSets[mode];
 return cases.map((c,i)=>{
  const a=audits[i],bad=indices.includes(i);
  const alternate=a.options.find(x=>!a.correct.includes(x));
  let chosen=bad?[alternate]:a.correct.slice();
  if(bad&&a.correct.includes('위반 확인 안 됨'))chosen=[a.options.find(x=>x!=='위반 확인 안 됨')];
  const proofs=a.questions.map(q=>q.proof[0]);
  if(bad&&i%2===0)proofs[0]=c.docs[0].facts.at(-1)[0];
  const hits=a.questions.map((q,j)=>({answerOK:!bad||j>0,proofOK:q.proof.includes(proofs[j])}));
  return {name:c.title,score:bad?45+(i%3)*7:95-(i%3)*5,verdictOK:!bad,hits,chosen,proofs,answers:a.questions.map(q=>q.answer),demo:true};
 });
}
function openDemo(){$('demoOverlay').classList.add('on');}
function closeDemo(){$('demoOverlay').classList.remove('on');}
function startDemo(mode){closeDemo();st.results=makeSampleResults(mode);startFinalChapter(true);}
$('demoBtn').onclick=openDemo;
$('demoClose').onclick=closeDemo;
$('demoOverlay').onclick=e=>{if(e.target===$('demoOverlay'))closeDemo()};
document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>startDemo(b.dataset.demo));
document.querySelectorAll('nav .nav').forEach(b=>b.onclick=()=>go(Number(b.dataset.screen)));$('back').onclick=()=>go(st.screen-1);$('forward').onclick=()=>go(st.screen+1);
let touch=null;const view=$('viewport');view.addEventListener('touchstart',e=>{if(e.touches.length===1)touch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});view.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*1.5)go(st.screen+(dx<0?1:-1))},{passive:true});document.addEventListener('keydown',e=>{if(st.final||st.ending>=0||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowRight')go(st.screen+1);if(e.key==='ArrowLeft')go(st.screen-1)});resetCase(0);
</script></body></html>
